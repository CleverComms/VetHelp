<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="UK veterinary drug dosage calculator for cats, dogs, rabbits, guinea pigs and other common species">
    <meta name="theme-color" content="#007aff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VetCalc">

    <title>VetCalc - Veterinary Drug Calculator</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

    <!-- Google Fonts - Onest -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Status bar overlay for iOS -->
        <div class="statusbar"></div>

        <!-- App Views -->
        <div class="view view-main view-init safe-areas">
            <!-- Splash Screen -->
            <div id="splash-screen" class="splash-screen">
                <div class="splash-content">
                    <div class="splash-icon">
                        <svg viewBox="0 0 100 100" class="splash-logo">
                            <defs>
                                <linearGradient id="splash-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#5ac8fa"/>
                                    <stop offset="100%" style="stop-color:#007aff"/>
                                </linearGradient>
                            </defs>
                            <circle cx="50" cy="50" r="45" fill="url(#splash-gradient)"/>
                            <path d="M50 25 L50 75 M25 50 L75 50" stroke="white" stroke-width="8" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h1 class="splash-title">VetCalc</h1>
                    <p class="splash-version" id="splash-version">2.15.6</p>
                    <div class="splash-loader">
                        <div class="preloader">
                            <span class="preloader-inner">
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                                <span class="preloader-inner-line"></span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Page -->
            <div class="page">
                <!-- Header -->
                <header class="header">
                    <h1>VetCalc</h1>
                    <span class="offline-badge" id="offline-indicator" style="display: none;">
                        <span class="badge">Offline</span>
                    </span>
                </header>

                <!-- Selection Info Bar (fixed) -->
                <div id="selection-info" class="selection-info">
                    <div class="selection-column" id="species-column">
                        <span class="selection-label">Species</span>
                        <span class="selection-value not-set" id="selected-species-display">—</span>
                    </div>
                    <div class="selection-column hidden" id="weight-column">
                        <span class="selection-label">Weight</span>
                        <span class="selection-value not-set" id="selected-weight-display">—</span>
                    </div>
                    <div class="selection-column selection-column-drug hidden" id="drug-column">
                        <span class="selection-label">Drug</span>
                        <span class="selection-value not-set" id="selected-drug-display">—</span>
                    </div>
                    <button class="reset-btn" id="reset-btn" aria-label="Reset all selections">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <!-- Spacer for fixed info bar -->
                <div id="selection-info-spacer" class="selection-info-spacer"></div>

                <!-- Update Banner -->
                <div id="update-banner" class="update-banner" style="display: none;">
                    <p class="update-title"><strong>Update Available</strong></p>
                    <p class="update-text">Tap Update to get the latest version.</p>
                    <div class="update-buttons">
                        <button class="button button-fill" id="update-btn">Update</button>
                        <button class="button" id="dismiss-update-btn">Later</button>
                    </div>
                </div>

                <!-- Page Content -->
                <div class="page-content">
                    <!-- Species Selection -->
                    <div id="species-section">
                    <div class="block-title">Species</div>
                    <div class="block block-strong inset no-padding">
                        <div class="species-scroll" id="species-grid">
                            <button class="species-btn" data-species="dog">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Dog face - floppy ears -->
                                        <ellipse cx="12" cy="13" rx="8" ry="7"/>
                                        <path d="M4.5 9C3.5 5 4.5 3 6 3c1.5 0 2.5 2 2.5 4"/>
                                        <path d="M19.5 9C20.5 5 19.5 3 18 3c-1.5 0-2.5 2-2.5 4"/>
                                        <circle cx="9" cy="12" r="1" fill="currentColor"/>
                                        <circle cx="15" cy="12" r="1" fill="currentColor"/>
                                        <ellipse cx="12" cy="15" rx="2" ry="1.5" fill="currentColor"/>
                                        <path d="M12 16.5V18"/>
                                        <path d="M10 18c0 1 1 1.5 2 1.5s2-.5 2-1.5"/>
                                    </svg>
                                </span>
                                <span class="species-name">Dog</span>
                            </button>
                            <button class="species-btn" data-species="cat">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Cat face - pointed ears -->
                                        <path d="M12 20c-5 0-8-3.5-8-8 0-2 0-6 3-9l2 4h6l2-4c3 3 3 7 3 9 0 4.5-3 8-8 8z"/>
                                        <circle cx="9" cy="11" r="1" fill="currentColor"/>
                                        <circle cx="15" cy="11" r="1" fill="currentColor"/>
                                        <path d="M12 14v1.5"/>
                                        <ellipse cx="12" cy="14" rx="1.5" ry="1" fill="currentColor"/>
                                        <path d="M12 15.5c-1 0-1.5.5-2 1"/>
                                        <path d="M12 15.5c1 0 1.5.5 2 1"/>
                                        <path d="M4 12H2"/><path d="M6 14H3"/>
                                        <path d="M20 12h2"/><path d="M18 14h3"/>
                                    </svg>
                                </span>
                                <span class="species-name">Cat</span>
                            </button>
                            <button class="species-btn" data-species="rabbit">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Rabbit face - long upright ears -->
                                        <ellipse cx="12" cy="15" rx="7" ry="6"/>
                                        <path d="M8 9C8 4 7 1 9 1s2 3 2 6"/>
                                        <path d="M16 9c0-5 1-8-1-8s-2 3-2 6"/>
                                        <circle cx="9" cy="14" r="1" fill="currentColor"/>
                                        <circle cx="15" cy="14" r="1" fill="currentColor"/>
                                        <ellipse cx="12" cy="17" rx="1.5" ry="1" fill="currentColor"/>
                                        <path d="M10.5 18.5c0 .5.7 1 1.5 1s1.5-.5 1.5-1"/>
                                    </svg>
                                </span>
                                <span class="species-name">Rabbit</span>
                            </button>
                            <button class="species-btn" data-species="guinea_pig">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Guinea pig face - round fluffy, small ears -->
                                        <ellipse cx="12" cy="13" rx="9" ry="7"/>
                                        <ellipse cx="5" cy="9" rx="2" ry="1.5"/>
                                        <ellipse cx="19" cy="9" rx="2" ry="1.5"/>
                                        <circle cx="8" cy="12" r="1" fill="currentColor"/>
                                        <circle cx="16" cy="12" r="1" fill="currentColor"/>
                                        <ellipse cx="12" cy="15" rx="2" ry="1.5" fill="currentColor"/>
                                        <path d="M10 17c0 .5 1 1 2 1s2-.5 2-1"/>
                                    </svg>
                                </span>
                                <span class="species-name">Guinea Pig</span>
                            </button>
                            <button class="species-btn" data-species="hamster">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Hamster face - round with big cheeks -->
                                        <ellipse cx="12" cy="13" rx="9" ry="8"/>
                                        <circle cx="6" cy="6" r="2.5"/>
                                        <circle cx="18" cy="6" r="2.5"/>
                                        <circle cx="8" cy="11" r="1" fill="currentColor"/>
                                        <circle cx="16" cy="11" r="1" fill="currentColor"/>
                                        <ellipse cx="12" cy="14" rx="1.5" ry="1" fill="currentColor"/>
                                        <path d="M10 16c0 .5 1 1 2 1s2-.5 2-1"/>
                                        <ellipse cx="6" cy="14" rx="2" ry="2.5" opacity="0.3" fill="currentColor"/>
                                        <ellipse cx="18" cy="14" rx="2" ry="2.5" opacity="0.3" fill="currentColor"/>
                                    </svg>
                                </span>
                                <span class="species-name">Hamster</span>
                            </button>
                            <button class="species-btn" data-species="ferret">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Ferret face - elongated, mask markings -->
                                        <ellipse cx="12" cy="13" rx="7" ry="8"/>
                                        <ellipse cx="6" cy="7" rx="2" ry="1.5"/>
                                        <ellipse cx="18" cy="7" rx="2" ry="1.5"/>
                                        <ellipse cx="9" cy="11" rx="2" ry="2.5" opacity="0.2" fill="currentColor"/>
                                        <ellipse cx="15" cy="11" rx="2" ry="2.5" opacity="0.2" fill="currentColor"/>
                                        <circle cx="9" cy="11" r="1" fill="currentColor"/>
                                        <circle cx="15" cy="11" r="1" fill="currentColor"/>
                                        <ellipse cx="12" cy="15" rx="2" ry="1.5" fill="currentColor"/>
                                        <path d="M10 18c0 .5 1 1 2 1s2-.5 2-1"/>
                                    </svg>
                                </span>
                                <span class="species-name">Ferret</span>
                            </button>
                            <button class="species-btn" data-species="rat">
                                <span class="species-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                        <!-- Rat face - pointed, large round ears -->
                                        <path d="M12 21c-5 0-8-4-8-8 0-3 2-7 8-10 6 3 8 7 8 10 0 4-3 8-8 8z"/>
                                        <circle cx="6" cy="7" r="3"/>
                                        <circle cx="18" cy="7" r="3"/>
                                        <circle cx="9" cy="12" r="1" fill="currentColor"/>
                                        <circle cx="15" cy="12" r="1" fill="currentColor"/>
                                        <ellipse cx="12" cy="15" rx="2" ry="1.5" fill="currentColor"/>
                                        <path d="M12 16.5V18"/>
                                        <path d="M4 14H2"/><path d="M5 16H2"/>
                                        <path d="M20 14h2"/><path d="M19 16h3"/>
                                    </svg>
                                </span>
                                <span class="species-name">Rat</span>
                            </button>
                        </div>
                    </div>
                    </div>

                    <!-- Weight Input (hidden until species selected) -->
                    <div id="weight-section">
                        <div class="block-title">Weight</div>
                        <div class="block block-strong inset">
                            <div class="weight-stepper-container">
                                <div class="stepper stepper-fill stepper-large stepper-round" id="weight-stepper">
                                    <div class="stepper-button-minus" id="weight-minus"></div>
                                    <div class="stepper-input-wrap">
                                        <input type="number" id="weight-input" inputmode="decimal" placeholder="0.0" step="0.1" min="0">
                                    </div>
                                    <div class="stepper-button-plus" id="weight-plus"></div>
                                </div>
                                <span class="weight-unit-label" id="weight-unit-label">kg</span>
                            </div>
                            <div class="weight-presets" id="weight-presets">
                                <!-- Populated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <!-- Drug Categories (hidden until species and weight selected) -->
                    <div id="category-section">
                        <div class="block-title">Category</div>
                        <div class="block block-strong inset no-padding">
                            <div class="category-scroll" id="drug-categories">
                                <!-- Populated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <!-- Drug Search and List (hidden until species and weight selected) -->
                    <div id="drugs-section">
                        <div class="block-title">Drugs</div>
                        <div class="list list-strong-ios list-outline-ios list-dividers-ios inset">
                            <ul>
                                <li class="item-content item-input">
                                    <div class="item-inner">
                                        <div class="item-input-wrap">
                                            <input type="text" id="drug-search" placeholder="Search drugs...">
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <!-- Drug List -->
                        <div class="list list-strong-ios list-outline-ios list-dividers-ios inset media-list" id="drug-list-container">
                            <ul id="drug-list">
                                <!-- Populated by JavaScript -->
                            </ul>
                        </div>
                    </div>

                    <!-- Result Section -->
                    <div id="result-section" style="display: none;">
                        <div class="block-title">Calculation Result</div>
                        <div class="card card-outline result-card">
                            <div class="card-header">
                                <span id="result-drug-name">-</span>
                                <span class="badge" id="result-species">-</span>
                            </div>
                            <div class="card-content card-content-padding">
                                <div class="result-dose" id="result-dose">
                                    <span class="dose-value">-</span>
                                    <span class="dose-unit"></span>
                                </div>

                                <div class="calculation-breakdown">
                                    <p class="block-title-medium">Calculation Breakdown</p>
                                    <div class="calculation-steps" id="calculation-steps">
                                        <!-- Populated by JavaScript -->
                                    </div>
                                </div>

                                <div class="result-notes" id="result-notes">
                                    <!-- Populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Footer -->
                <footer class="footer">
                    <p class="footer-warning">Always verify calculations with product datasheets.</p>
                    <p class="footer-version">VetCalc <span id="app-version">2.15.6</span></p>
                </footer>
            </div>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="js/drug-database.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            let swRegistration = null;

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                        swRegistration = registration;

                        // Check for updates on load
                        registration.update();

                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    showUpdateBanner(registration);
                                }
                            });
                        });
                    })
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });

            // Also check for updates when app becomes visible (user returns to PWA)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && swRegistration) {
                    swRegistration.update();
                }
            });
        }

        function showUpdateBanner(registration) {
            const banner = document.getElementById('update-banner');
            const updateBtn = document.getElementById('update-btn');
            const dismissBtn = document.getElementById('dismiss-update-btn');

            banner.style.display = 'block';

            updateBtn.addEventListener('click', () => {
                if (registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                window.location.reload();
            });

            dismissBtn.addEventListener('click', () => {
                banner.style.display = 'none';
            });
        }

        // Online/Offline indicator
        function updateOnlineStatus() {
            const indicator = document.getElementById('offline-indicator');
            indicator.style.display = navigator.onLine ? 'none' : 'inline-flex';
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Prevent pinch-to-zoom on iOS
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        document.addEventListener('gesturechange', function(e) {
            e.preventDefault();
        });
        document.addEventListener('gestureend', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
